[tool.poetry]
name = "shards-ai"
version = "0.1.0"
description = "Deterministic Shards of Infinity game engine and AI experiments"
authors = ["Shards AI contributors"]
readme = "README.md"
packages = [{ include = "shards_ai" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
torch = ">=2.0,<3.0"
numpy = ">=1.26,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
